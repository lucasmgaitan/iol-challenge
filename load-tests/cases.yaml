# Rules under test (src/controllers/hello-controller.ts):
#   /hello         token bucket, capacity 5, refills 1 token per second
#   /hello-window  sliding window, 5 requests per 5 s
#
# Patterns:
#   constant  { rate }        requests per second, evenly spaced
#   burst     { size, every } `size` simultaneous requests, repeated every `every`
#   spike     { size, at }    `size` simultaneous requests, once, `at` after the start
#
# expect.clients.<name>.allowed / rejected take an exact number or a [min, max] range.

cases:
  verify:
    description: Rate limiting contract across 3 replicas behind nginx (run by CI)
    duration: 30s
    clients:
      - name: steady
        endpoint: /hello
        pattern: { type: constant, rate: 1 }
      - name: greedy
        endpoint: /hello
        pattern: { type: constant, rate: 10 }
      - name: bursty
        endpoint: /hello
        pattern: { type: burst, size: 8, every: 10s }
      - name: greedy-window
        endpoint: /hello-window
        pattern: { type: constant, rate: 10 }
    expect:
      clients:
        steady: { rejected: 0 }
        # capacity 5 + 1 token/s refilled during 30 s, plus/minus 2 for request timing
        greedy: { allowed: [33, 37] }
        # each burst finds a full bucket after 10 s idle: 5 allowed and 3 rejected, 3 times
        bursty: { allowed: 15, rejected: 9 }
        # first window 5; then c + 1 <= 5 - n(1 - e/W) settles at n = 4 per window (rejections
        # are not counted): 5 + 4 x 5 full windows + 1..4 in the last one = 26..29, plus/minus 1
        greedy-window: { allowed: [25, 30] }
      latency_p95_ms: 50
      min_replicas: 2

  showcase:
    description: 60 s of mixed traffic; Redis goes down at 20 s and comes back at 40 s
    duration: 60s
    clients:
      - name: steady
        endpoint: /hello
        pattern: { type: constant, rate: 1 }
      - name: bursty
        endpoint: /hello
        pattern: { type: burst, size: 8, every: 10s }
      - name: spiky
        endpoint: /hello
        pattern: { type: spike, size: 30, at: 12s }
      - name: bucket
        endpoint: /hello
        pattern: { type: burst, size: 5, every: 3s }
      - name: window
        endpoint: /hello-window
        pattern: { type: burst, size: 5, every: 3s }
    redis_outage: { at: 20s, for: 20s }
    expect:
      clients:
        steady: { rejected: 0 }
        spiky: { allowed: 5, rejected: 25 }

  algorithms:
    description: The same bursts against the token bucket and the sliding window
    duration: 30s
    clients:
      - name: bucket
        endpoint: /hello
        pattern: { type: burst, size: 5, every: 3s }
      - name: window
        endpoint: /hello-window
        pattern: { type: burst, size: 5, every: 3s }

  noisy-neighbor:
    description: A client hammering the API does not eat into another client's limit
    duration: 30s
    clients:
      - name: hammering
        endpoint: /hello
        pattern: { type: constant, rate: 20 }
      - name: polite
        endpoint: /hello
        pattern: { type: constant, rate: 1 }
    expect:
      clients:
        polite: { rejected: 0 }
        # capacity 5 + 1 token/s refilled during 30 s, plus/minus 2 for request timing
        hammering: { allowed: [33, 37] }
