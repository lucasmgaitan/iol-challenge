name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: rate-limiter

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: rate-limiter/.nvmrc
          cache: npm
          cache-dependency-path: rate-limiter/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
