events {}

http {
  upstream api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
