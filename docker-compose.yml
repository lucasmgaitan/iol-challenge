name: iol-rate-limiter

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    image: iol-rate-limiter-api
    environment:
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      TRUST_PROXY: 'true'
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/metrics']
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  k6:
    image: grafana/k6:2.3.0
    profiles: ['load']
    environment:
      BASE_URL: http://nginx
      CASE_FILE: /case/case.json
      K6_NO_USAGE_REPORT: 'true'
      COLOR:
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      - nginx
