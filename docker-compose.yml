name: iol-rate-limiter

services:
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    image: iol-rate-limiter-api
    environment:
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      TRUST_PROXY: 'true'
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/metrics']
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rate-limiter.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.3.0
    profiles: ['load']
    environment:
      BASE_URL: http://nginx
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99)
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ./load-tests:/scripts:ro
    depends_on:
      - nginx
